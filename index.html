<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c1849b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LifeOS">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/lifeos-192.png">
  <meta name="description" content="LifeOS — your private, offline life planner.">
  <title>LifeOS Planner</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-lockup">
        <div class="brand-mark">L</div>
        <div><div class="brand-name">LifeOS</div><div class="brand-caption" data-i18n="personalPlanner">PERSONAL PLANNER</div></div>
      </div>
      <div class="sidebar-profile">
        <div class="avatar" id="avatarInitial">U</div>
        <div class="profile-copy"><strong id="sidebarName" data-user-content>Your space</strong><span data-i18n="yourPrivateSpace">Your private space</span></div>
        <button class="icon-button tiny" id="openSettings" aria-label="Settings" title="Settings">⚙</button>
      </div>
      <nav class="nav-groups" id="mainNav" aria-label="Main navigation">
        <div class="nav-label" data-i18n="overview">OVERVIEW</div>
        <button class="nav-item active" data-route="dashboard"><span class="nav-icon">⌂</span><span data-i18n="dashboard">Dashboard</span></button>
        <button class="nav-item" data-route="today"><span class="nav-icon">☀</span><span data-i18n="today">Today</span><span class="nav-pill" id="todayCount">0</span></button>
        <button class="nav-item" data-route="week"><span class="nav-icon">▦</span><span data-i18n="week">Week</span></button>
        <button class="nav-item" data-route="month"><span class="nav-icon">▤</span><span data-i18n="month">Month</span></button>
        <button class="nav-item" data-route="year"><span class="nav-icon">✧</span><span data-i18n="year">Year</span></button>
        <div class="nav-label" data-i18n="personalGrowth">PERSONAL GROWTH</div>
        <button class="nav-item" data-route="habits"><span class="nav-icon">◉</span><span data-i18n="habits">Habits</span></button>
        <button class="nav-item" data-route="routines"><span class="nav-icon">↻</span><span data-i18n="routines">Routines</span></button>
        <button class="nav-item" data-route="glow"><span class="nav-icon">✿</span><span data-i18n="glowUp">Glow Up</span></button>
        <button class="nav-item" data-route="wellness"><span class="nav-icon">♡</span><span data-i18n="wellnessCycle">Wellness & Cycle</span></button>
        <div class="nav-label" data-i18n="lifeManagement">LIFE MANAGEMENT</div>
        <button class="nav-item" data-route="finance"><span class="nav-icon">＄</span><span data-i18n="finance">Finance</span></button>
        <button class="nav-item" data-route="meals"><span class="nav-icon">♧</span><span data-i18n="mealsGroceries">Meals & Groceries</span></button>
        <button class="nav-item" data-route="goals"><span class="nav-icon">◎</span><span data-i18n="goalsVision">Goals & Vision</span></button>
        <button class="nav-item" data-route="journal"><span class="nav-icon">▱</span><span data-i18n="journal">Journal</span></button>
        <button class="nav-item" data-route="reading"><span class="nav-icon">▣</span><span data-i18n="readingList">Reading List</span></button>
        <button class="nav-item" data-route="outfits"><span class="nav-icon">◇</span><span data-i18n="ootdWishlist">OOTD & Wishlist</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="privacy-note"><span class="privacy-dot"></span><div><strong data-i18n="privateByDesign">Private by design</strong><small data-i18n="dataStaysOnDevice">Your data stays on this device.</small></div></div>
        <button class="nav-item" data-route="settings"><span class="nav-icon">⚙</span><span data-i18n="settings">Settings & Backup</span></button>
        <div class="version-note">LifeOS · Offline edition</div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
          <div class="breadcrumb"><span>LifeOS</span><i>/</i><strong id="breadcrumbCurrent">Dashboard</strong></div>
        </div>
        <div class="topbar-actions">
          <span class="offline-indicator"><span></span><b data-i18n="offlineReady">Offline ready</b></span>
          <select class="top-language" id="topLanguage" aria-label="Language"><option value="en">EN</option><option value="es">ES</option><option value="fr">FR</option><option value="de">DE</option><option value="ar">AR</option></select>
          <div class="topbar-themes" id="topbarThemes" aria-label="Quick themes"><button type="button" data-theme="blush" title="Blush" style="--swatch:#d9a7b9"></button><button type="button" data-theme="latte" title="Latte" style="--swatch:#b89473"></button><button type="button" data-theme="sage" title="Sage" style="--swatch:#8ca68f"></button><button type="button" data-theme="lilac" title="Lilac" style="--swatch:#a895c7"></button><button type="button" data-theme="cherry" title="Cherry" style="--swatch:#b74f66"></button></div>
          <button class="icon-button" id="quickAdd" title="Quick add">＋</button>
          <button class="profile-chip" id="topProfile"><span class="avatar small" id="topAvatar">U</span><span id="topName" data-user-content>Your space</span></button>
        </div>
      </header>
      <section class="content-wrap" id="content" aria-live="polite">
        <div class="loading-card"><div class="spinner"></div><span>Opening your space…</span></div>
      </section>
      <footer class="app-footer"><span>LifeOS</span><span data-i18n="localPrivacy">Your information is stored locally on this device.</span></footer>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><div><p class="eyebrow" id="modalEyebrow">LIFEOS</p><h2 id="modalTitle">Add item</h2></div><button class="icon-button" id="closeModal" aria-label="Close">×</button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </section>
  </div>
  <input type="file" id="restoreInput" accept=".json,application/json" hidden>
  <input type="file" id="photoInput" accept="image/*" hidden>
  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

  <script src="assets/js/db.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
  <script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {})); }</script>
</body>
</html>
